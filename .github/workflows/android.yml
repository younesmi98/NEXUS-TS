name: NEXUS TS Android checks

on:
  push:
    branches: [final1]
  pull_request:
    branches: [final1]
  workflow_dispatch:

permissions:
  contents: read

env:
  ANDROID_HOME: ${{ runner.temp }}/android-sdk

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout NEXUS TS
        uses: actions/checkout@v4

      - name: Fetch and verify pinned TeamSpeak source
        run: bash ./bootstrap.sh

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          accept-android-sdk-licenses: true

      - name: Install Android platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Test and build
        run: ./gradlew :protocol:test :ts3j:test :app:testDebugUnitTest :app:lintDebug :app:assembleDebug --stacktrace --no-daemon

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/NEXUS-TS-final1-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: NEXUS-TS-final1-debug
          path: app/build/outputs/apk/debug/NEXUS-TS-final1-debug.apk
          if-no-files-found: error
          retention-days: 30
